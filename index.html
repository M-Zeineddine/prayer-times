<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>مواقيت الصلاة</title>
  <meta name="description" content="مواقيت الصلاة بحسب مكتب سماحة السيد محمد حسين فضل الله" />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0e5a5e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="مواقيت الصلاة" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">

    <header class="topbar">
      <button id="langToggle" class="sq-btn" aria-label="Language">EN</button>
      <div class="brand">
        <span class="brand-title" id="brandTitle">مواقيت الصلاة</span>
        <span class="brand-sub" id="brandSub">مكتب سماحة السيد محمد حسين فضل الله</span>
      </div>
      <button id="locationBtn" class="sq-btn" aria-label="Location">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 15s5.5-5.3 5.5-9.2A5.5 5.5 0 0 0 2.5 5.8C2.5 9.7 8 15 8 15z"/><circle cx="8" cy="5.8" r="2"/></svg>
      </button>
    </header>

    <button class="location-row" id="cityChip">
      <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 15s5.5-5.3 5.5-9.2A5.5 5.5 0 0 0 2.5 5.8C2.5 9.7 8 15 8 15z"/><circle cx="8" cy="5.8" r="2"/></svg>
      <span id="cityLabel">...</span>
    </button>

    <section class="date-nav">
      <button id="prevDay" class="nav-btn" aria-label="Previous day">‹</button>
      <div class="date-display">
        <div id="gregDate" class="greg-date">—</div>
        <div id="hijriDate" class="hijri-date">—</div>
      </div>
      <button id="nextDay" class="nav-btn" aria-label="Next day">›</button>
    </section>

    <section class="next-prayer" id="nextPrayerCard">
      <div class="np-top">
        <span class="np-eyebrow" id="nextPrayerEyebrow">NEXT</span>
        <span class="np-name" id="nextPrayerLabel">—</span>
        <span class="np-time" id="nextPrayerTime">—</span>
      </div>
      <div class="np-countdown" id="nextPrayerCountdown">--:--:--</div>
    </section>

    <ul id="timesGrid" class="prayer-list">
      <li class="loader" id="loader"></li>
    </ul>

    <footer class="app-footer">
      <span id="sourceLabel">المصدر: </span>
      <a href="https://www.fadlullah.org.lb/prayer-time" target="_blank" rel="noopener">fadlullah.org.lb</a>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="citySheet">
    <div class="sheet-handle"></div>
    <input type="search" id="citySearch" class="city-search" placeholder="ابحث عن مدينة..." autocomplete="off" />
    <div id="cityList" class="city-list"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
